#
# The application on screen in the demo recording. Deliberately declares no
# `deploy.resources` limits: the DinD test swarm runs on a threaded cgroup v2
# hierarchy and refuses to start a container that asks for one.
#
# Log lines are generated on a fixed cycle rather than randomly, so two
# recordings of the same tape show the same traffic.

networks:
  shop:
    driver: overlay

services:
  web:
    image: nginx:alpine
    networks: [shop]
    ports:
      - "8080:80"
    deploy:
      replicas: 2

  api:
    image: alpine:3.20
    networks: [shop]
    deploy:
      replicas: 3
    command: >
      sh -c '
        i=0;
        while true; do
          i=$$((i + 1));
          ts=$$(date -u +%Y-%m-%dT%H:%M:%SZ);
          case $$((i % 6)) in
            0) printf "%s INFO  api   GET  /v1/products?page=%d 200 %dms\n"  "$$ts" "$$((i % 7 + 1))" "$$((i % 21 + 9))" ;;
            1) printf "%s INFO  api   GET  /v1/orders/%d 200 %dms\n"         "$$ts" "$$((8000 + i))"  "$$((i % 17 + 11))" ;;
            2) printf "%s INFO  api   POST /v1/cart/items 201 %dms\n"        "$$ts" "$$((i % 29 + 14))" ;;
            3) printf "%s INFO  api   POST /v1/checkout 201 %dms\n"          "$$ts" "$$((i % 41 + 32))" ;;
            4) printf "%s WARN  api   GET  /v1/products/%d 200 %dms slow query\n" "$$ts" "$$((i % 90 + 10))" "$$((i % 60 + 180))" ;;
            5) printf "%s INFO  api   GET  /healthz 200 1ms\n"               "$$ts" ;;
          esac;
          sleep 0.7;
        done'

  worker:
    image: alpine:3.20
    networks: [shop]
    deploy:
      replicas: 2
    command: >
      sh -c '
        i=0;
        while true; do
          i=$$((i + 1));
          ts=$$(date -u +%Y-%m-%dT%H:%M:%SZ);
          case $$((i % 3)) in
            0) printf "%s INFO  worker job=email.receipt   id=%d done in %dms\n" "$$ts" "$$((4400 + i))" "$$((i % 120 + 90))" ;;
            1) printf "%s INFO  worker job=stock.reserve   id=%d done in %dms\n" "$$ts" "$$((4400 + i))" "$$((i % 40 + 25))" ;;
            2) printf "%s INFO  worker job=invoice.render  id=%d done in %dms\n" "$$ts" "$$((4400 + i))" "$$((i % 300 + 210))" ;;
          esac;
          sleep 1.3;
        done'

  # Global mode: one task per node, so the services view shows a 3/3 global
  # service next to the replicated ones and the node story is visible.
  logshipper:
    image: alpine:3.20
    networks: [shop]
    deploy:
      mode: global
    command: >
      sh -c '
        while true; do
          printf "%s INFO  ship  flushed batch to collector\n" "$$(date -u +%Y-%m-%dT%H:%M:%SZ)";
          sleep 5;
        done'
