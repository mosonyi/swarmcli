version: 2

project_name: swarmcli

before:
  hooks:
    - go mod download
    - go mod verify

release:
  prerelease: auto
  draft: false
  use_existing_draft: true

env:
  - CGO_ENABLED=0

builds:
  - id: linux
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
      - 386
    goarm:
      - 6
      - 7
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X github.com/Eldara-Tech/swarmcli/charts.engineVersion={{.Version}}
    main: .

  - id: osx
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X github.com/Eldara-Tech/swarmcli/charts.engineVersion={{.Version}}
    main: .

  - id: windows
    goos:
      - windows
    goarch:
      - amd64
      - arm64
      - 386
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X github.com/Eldara-Tech/swarmcli/charts.engineVersion={{.Version}}
    main: .

  - id: freebsd
    goos:
      - freebsd
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X github.com/Eldara-Tech/swarmcli/charts.engineVersion={{.Version}}
    main: .

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE*

universal_binaries:
  - id: darwin-universal
    ids:
      - osx
    replace: true
    name_template: "{{ .ProjectName }}"

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true

# Homebrew tap (cask)
homebrew_casks:
  - name: swarmcli
    # Don't update the public tap for prereleases (-rc) or snapshots; GA only.
    skip_upload: "auto"
    ids:
      - default
    binaries:
      - swarmcli
    repository:
      owner: Eldara-Tech
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://swarmcli.io"
    description: "Docker Swarm TUI management tool"
    commit_author:
      name: Eldara Tech
      email: hello@eldara.io
    conflicts:
      - cask: swarmcli-be
    # GoReleaser binaries are not Apple-notarized; strip the Gatekeeper
    # quarantine xattr on install so the CLI runs without a security prompt.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/swarmcli"]
          end

# Scoop bucket for Windows
scoops:
  - name: swarmcli
    # Don't update the public bucket for prereleases (-rc) or snapshots; GA only.
    skip_upload: "auto"
    ids:
      - default
    repository:
      owner: Eldara-Tech
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    commit_author:
      name: Eldara Tech
      email: hello@eldara.io
    homepage: "https://swarmcli.io"
    description: "Docker Swarm TUI management tool"
    license: "Apache-2.0"
    post_install:
      - "Write-Host 'swarmcli installed successfully!' -ForegroundColor Green"

# Docker images (multi-arch; replaces the deprecated dockers + docker_manifests)
dockers_v2:
  - id: swarmcli
    images:
      - "eldaratech/swarmcli"
    dockerfile: Dockerfile.release
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Tag }}"
      # Only move :latest for stable releases — never on -rc/-beta tags.
      - '{{ if not .Prerelease }}latest{{ end }}'
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
