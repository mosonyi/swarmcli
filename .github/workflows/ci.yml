name: SwarmCLI CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'assets/**'
      - '.devcontainer/**'
      - '.idea/**'
      - '.gitignore'
      - '.github/release_template.yml'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'assets/**'
      - '.devcontainer/**'
      - '.idea/**'
      - '.gitignore'
      - '.github/release_template.yml'

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go fmt
        run: |
          gofmt -w .
          git diff --exit-code

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: latest

      - name: Run lint
        run: golangci-lint run ./... --build-tags=integration

  vet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code || (echo "Run go mod tidy locally" && exit 1)

  test:
    needs: [fmt, lint, vet]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -race -count=1 -timeout 5m ./...

  govulncheck:
    needs: [fmt, lint, vet]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        # GO-2026-4887 and GO-2026-4883 are Docker daemon-side vulnerabilities
        # (AuthZ plugin handler, plugin privilege validation). SwarmCLI is a
        # client-only tool; these code paths are never executed at runtime.
        # Fixed in: N/A — docker/docker@v28.5.2 is the latest release with no
        # upstream fix available. govulncheck has no native ignore flag, so the
        # JSON output is filtered to suppress only these known false-positives.
        run: |
          python3 - <<'PYEOF'
          import subprocess, sys, json

          SUPPRESSED = {"GO-2026-4887", "GO-2026-4883"}

          # -format json always exits 0; vulnerability data is inside the JSON stream.
          proc = subprocess.run(
              ["govulncheck", "-format", "json", "./..."],
              capture_output=True, text=True,
          )

          # Parse the pretty-printed JSON stream (one object per message)
          text, depth, start = proc.stdout, 0, None
          symbol_vulns = set()
          for i, c in enumerate(text):
              if c == '{':
                  if depth == 0:
                      start = i
                  depth += 1
              elif c == '}':
                  depth -= 1
                  if depth == 0 and start is not None:
                      try:
                          obj = json.loads(text[start:i+1])
                          if obj.get('finding'):
                              f = obj['finding']
                              osv = f.get('osv', '')
                              # Symbol-level finding: trace contains a frame with a function
                              if osv and any('function' in fr for fr in f.get('trace', [])):
                                  symbol_vulns.add(osv)
                      except Exception:
                          pass
                      start = None

          unexpected = symbol_vulns - SUPPRESSED
          if unexpected:
              subprocess.run(["govulncheck", "./..."])
              sys.exit(1)

          if symbol_vulns:
              print("govulncheck: suppressed", len(symbol_vulns),
                    "daemon false-positive(s):", sorted(symbol_vulns))
          else:
              print("govulncheck: no vulnerabilities found.")
          PYEOF

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI
        run: go build -v -o swarmcli .

      - name: Build Docker Image
        run: docker build -t swarmcli-dev .
