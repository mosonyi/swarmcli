version: "3.9"

networks:
  backend:
  default:
    driver: overlay

volumes:
  whoami_data:

secrets:
  whoami_secret:
    file: ./secrets/whoami_secret.txt

configs:
  whoami_config:
    file: ./configs/whoami.conf
  whoami_single_config:
    file: ./configs/whoami_single.conf

services:
  whoami:
    image: alpine:latest
    networks:
      - backend
    volumes:
      - whoami_data:/data
    secrets:
      - source: whoami_secret
        target: /run/secrets/whoami_secret
    configs:
      - source: whoami_config
        target: /etc/whoami/config
    deploy:
      replicas: 2
    # Uses alpine's built-in busybox `nc` (no `apk add`) so a task restart does
    # NOT depend on network access to the package CDN. Re-installing
    # netcat-openbsd on every container start made multi-replica restarts flake
    # under slow-network windows (TestRestartServiceWithProgress). The `|| sleep`
    # guard keeps the container up even if a connection attempt errors — no test
    # exercises the HTTP endpoint, only that tasks stay running.
    command: >
      sh -c '
        echo "Starting whoami service...";
        while true; do
          printf "HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\n\r\nService: whoami\nConfig:\n%s\n\n" "$$(cat /etc/whoami/config)" \
          | nc -l -p 80 2>/dev/null || sleep 1;
        done
      '

    ports:
      - "8081:80"

  whoami_single:
    image: alpine:latest
    # Issue #430 fixture: a service carrying a rich runtime/security spec.
    # Each of these must round-trip through inspect/edit reconstruction rather
    # than being silently dropped. Kept to fields that deploy cleanly on the
    # DinD test Swarm without kernel/plugin surprises (read_only and sysctls
    # are covered by unit tests instead — they break apk/are kernel-dependent).
    hostname: whoami-single
    cap_add:
      - SYS_NICE
    cap_drop:
      - NET_RAW
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 20s
    ulimits:
      nofile:
        soft: 20000
        hard: 40000
    configs:
      # uid/gid/mode must survive reconstruction (mode 0444 → inspect 292).
      - source: whoami_single_config
        target: /etc/whoami/config
        uid: "0"
        gid: "0"
        mode: 0444
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: pause
        monitor: 30s
      resources:
        limits:
          pids: 200
    # Issue #379 fixture: a service with a healthcheck. Both inspect and
    # compose reconstruction must surface it.
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Issue #428 fixture: a service with a logging driver + options. Both
    # inspect and compose reconstruction must surface the logging block. Uses
    # the always-available json-file driver so the stack deploys without plugins.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # See whoami above: built-in busybox `nc`, no `apk add` on restart.
    command: >
      sh -c '
        echo "Starting whoami_single service...";
        while true; do
          printf "HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\n\r\nService: whoami_single\nConfig:\n%s\n\n" "$$(cat /etc/whoami/config)" \
          | nc -l -p 80 2>/dev/null || sleep 1;
        done
      '
    ports:
      - "8082:80"
  # Issue #363 regression fixture: a service using ONLY the explicitly
  # declared "default" network. Reconstruction must retain both the
  # top-level networks: default key and this service's networks: [default].
  default_net_probe:
    image: alpine:latest
    networks:
      - default
    # Issue #430 fixture: network-oriented runtime fields (these would break
    # apk on the whoami services, so they live on this no-network-egress probe).
    hostname: probe
    extra_hosts:
      - "db.internal:10.0.0.5"
    dns:
      - 8.8.8.8
    dns_search:
      - corp.local
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
    command: >
      sh -c 'while true; do sleep 3600; done'

  log_ticker:
    image: alpine:latest
    deploy:
      replicas: 1
    command: >
      sh -c '
        echo "Starting log_ticker service...";
        i=0;
        while true; do
          echo "log_ticker: tick $i - $$(date)";
          i=$$((i+1));
          sleep 1;
        done
      '

