version: "3.9"

networks:
  backend:

volumes:
  whoami_data:

secrets:
  whoami_secret:
    file: ./secrets/whoami_secret.txt

configs:
  whoami_config:
    file: ./configs/whoami.conf
  whoami_single_config:
    file: ./configs/whoami_single.conf

services:
  whoami:
    image: alpine:latest
    networks:
      - backend
    volumes:
      - whoami_data:/data
    secrets:
      - source: whoami_secret
        target: /run/secrets/whoami_secret
    configs:
      - source: whoami_config
        target: /etc/whoami/config
    deploy:
      replicas: 2
    command: >
      sh -c '
        apk add --no-cache netcat-openbsd;
        echo "Starting whoami service...";
        while true; do
          printf "HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\n\r\nService: whoami\nConfig:\n%s\n\n" "$$(cat /etc/whoami/config)" \
          | nc -l -p 80 -q 1;
        done
      '

    ports:
      - "8081:80"

  whoami_single:
    image: alpine:latest
    configs:
      - source: whoami_single_config
        target: /etc/whoami/config
    deploy:
      replicas: 1
    command: >
      sh -c '
        apk add --no-cache netcat-openbsd;
        echo "Starting whoami_single service...";
        while true; do
          printf "HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\n\r\nService: whoami_single\nConfig:\n%s\n\n" "$$(cat /etc/whoami/config)" \
          | nc -l -p 80 -q 1;
        done
      '
    ports:
      - "8082:80"
  log_ticker:
    image: alpine:latest
    deploy:
      replicas: 1
    command: >
      sh -c '
        echo "Starting log_ticker service...";
        i=0;
        while true; do
          echo "log_ticker: tick $i - $$(date)";
          i=$$((i+1));
          sleep 1;
        done
      '

