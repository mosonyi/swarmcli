name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether the integration pipeline needs to run; the integration job
  # gates on this output. Filtering at the job level (not the workflow trigger)
  # keeps a "skipped" status on the PR so branch-protection required checks
  # remain satisfied.
  changes:
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.f.outputs.integration }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: f
        with:
          filters: |
            integration:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - 'Dockerfile.release'
              - 'docker-compose.yaml'
              - 'test-setup/**'
              - 'integration-tests/**'
              - 'scripts/**'
              - '.github/workflows/integration-tests.yml'

  integration:
    needs: [changes]
    if: needs.changes.outputs.integration == 'true'
    name: Run integration tests
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:29-dind
        options: >-
          --privileged
          --health-cmd="docker info >/dev/null 2>&1 || exit 1"
          --health-interval=2s
          --health-retries=20
          --health-timeout=2s
          --health-start-period=5s
        ports:
          - 22375:2375   # match your docker-compose manager
        env:
          DOCKER_TLS_CERTDIR: ""

    env:
      DOCKER_HOST: tcp://localhost:22375
      DOCKER_TLS_CERTDIR: ""
      CI: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Verify Docker & Go
        run: |
          docker version
          go version
          docker info | sed -n '/Swarm:/,/ClusterID/p'

      - name: Ensure Swarm is initialized
        run: docker swarm init || true

      - name: Setup Swarm
        run: bash test-setup/testenv.sh up && bash test-setup/testenv.sh deploy

      - name: Run full integration pipeline
        run: bash test-setup/testenv.sh test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report
          path: /tmp/test-report.xml
