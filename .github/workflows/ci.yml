name: SwarmCLI CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which file groups changed; downstream jobs gate on these outputs.
  # Filtering at the job level (not the workflow trigger) means skipped jobs
  # still publish a "skipped" status that satisfies branch-protection required
  # checks — workflow-trigger paths-ignore would leave required checks pending.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
      docker: ${{ steps.f.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        with:
          filters: |
            code:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
              # The charts command blocks in these two are generated from
              # cli/commands.go and asserted by a test. Editing one by hand is
              # exactly what that test exists to catch, so the test has to run
              # on a PR that touches nothing else.
              - 'README.md'
              - 'charts/README.md'
            docker:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - 'Dockerfile.release'
              - '.github/workflows/ci.yml'
              # The build job runs it, so a change that weakens the guard has to
              # run the guard.
              - 'scripts/check-oss-artefact.sh'

  fmt:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go fmt
        run: |
          gofmt -w .
          git diff --exit-code

  lint:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest

      - name: Run lint
        run: golangci-lint run ./... --build-tags=integration

  vet:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code || (echo "Run go mod tidy locally" && exit 1)

  test:
    needs: [changes, fmt, lint, vet]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -race -count=1 -timeout 5m ./...

  build:
    needs: [changes, test]
    # `test` is gated on the `code` filter, this job on `docker`, and the two
    # are not the same set: a diff touching only the Dockerfiles leaves `test`
    # skipped, and a skipped `needs` skips the dependent job whatever its own
    # `if:` says. So the one job that ever runs `docker build`, and the only
    # place the release-image guard below fires, could not run for exactly the
    # diff it was written for — #631 bumped both Dockerfiles and `changes` read
    # `code = false, docker = true`, leaving neither file built. `!cancelled()`
    # keeps the needs edge for ordering while tolerating a skipped `test`; a
    # failed one still skips this job, so a Docker build never runs on a tree
    # whose tests are red.
    if: ${{ !cancelled() && needs.changes.outputs.docker == 'true' && needs.test.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI
        run: go build -v -o swarmcli .

      # The same gate .goreleaser.yml runs on each published binary, run here on
      # every change so it is not a check that only ever fires against a tag —
      # by which point the tag cannot be moved without a human. It reads the
      # module graph Go stamped into the binary, so it catches a private module
      # arriving through a dependency as well as through an import.
      - name: The build carries nothing private
        run: ./scripts/check-oss-artefact.sh swarmcli

      - name: Build Docker Image
        run: docker build -t swarmcli-dev .

      # Dockerfile.release has been in this job's paths filter all along while
      # the step above built the *other* Dockerfile, so nothing has ever built
      # the file that produces the published image — and #548 was deferred out of
      # #547 precisely because a base change "cannot be rehearsed without a
      # Docker daemon". There is one here.
      #
      # goreleaser's dockers_v2 stages each platform's binary under its
      # $TARGETPLATFORM before building, so that layout has to be faked for a
      # plain `docker build`; TARGETPLATFORM is an automatic arg under buildx and
      # an ordinary one here. amd64 only, because what this catches is a base
      # image that cannot run the binary at all, and that is not architecture-
      # specific.
      #
      # Built here rather than reusing the binary from "Build CLI" above, and the
      # difference is the whole point: that step leaves CGO on, so on a runner
      # with gcc it links against glibc, and an Alpine base answers `exec
      # /swarmcli: no such file or directory`. .goreleaser.yml sets
      # CGO_ENABLED=0, so a probe that does not is not rehearsing the release —
      # it is testing a binary the release never builds.
      - name: The release image builds and the binary runs in it
        run: |
          mkdir -p linux/amd64
          CGO_ENABLED=0 go build -o linux/amd64/swarmcli .
          docker build -f Dockerfile.release --build-arg TARGETPLATFORM=linux/amd64 -t swarmcli-release-probe .
          got=$(docker run --rm swarmcli-release-probe version)
          echo "$got"
          # Positive control: a check that passes because it read nothing is the
          # failure mode this step exists to avoid.
          case "$got" in
            *"chart engine"*) ;;
            *) echo "::error::'swarmcli version' produced no recognisable output in the release image (got: ${got:-<nothing>})"; exit 1 ;;
          esac
          # The two things the base must still provide: TLS roots for chart
          # repositories, and an ssh binary for `ssh://` Docker contexts. Both
          # come from the base image, so a narrower one silently breaking either
          # is exactly what this guards.
          docker run --rm --entrypoint sh swarmcli-release-probe -c 'test -s /etc/ssl/certs/ca-certificates.crt && command -v ssh >/dev/null' || {
            echo "::error::the release image lost ca-certificates or openssh-client — chart repositories over HTTPS and ssh:// contexts would fail at runtime, with nothing at build time to say so"
            exit 1
          }
          echo "the release image runs, reports a chart engine, and keeps its TLS roots and ssh client"
